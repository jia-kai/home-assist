[project]
name = "hoast-finetune"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torch==2.9.1",
    "transformers==4.57.6",
    "trl==0.26.2",
    "peft==0.18.1",
    "accelerate>=1.12,<2",
    "pydantic>=2.12",
    "python-kasa>=0.10.2",
    "python-dotenv>=1.1",
    "pyright>=1.1.400",
    "ruff>=0.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

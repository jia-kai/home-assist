[project]
name = "hoast"
version = "0.1.0"
description = "Home Assistant with local inference and tool-based actions"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "huggingface-hub>=0.36,<1.0",
    "pydantic>=2.12,<3",
    "torch>=2.9,<2.10",
    "transformers>=4.55,<4.58",
    "optimum-intel[openvino,nncf]>=1.26,<2",
    "openvino-genai>=2026.3,<2027",
    "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pyright>=1.1.400", "ruff>=0.12"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pyright]
include = ["hoast", "tools", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = ["UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

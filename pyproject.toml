[project]
name = "hoast"
version = "0.1.0"
description = "Home Assistant with local inference and tool-based actions"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "python-kasa>=0.10.2",
    "huggingface-hub>=0.36",
    "pydantic>=2.12",
    "torch>=2.9",
    "transformers>=4.55",
    "optimum-intel[openvino,nncf]>=1.26",
    "openvino-genai>=2026.3",
    "python-dotenv>=1.1",
    "soundfile>=0.13",
    "numpy>=2.3",
    "onnxruntime>=1.24",
    "scipy>=1.16",
    "psutil>=7",
    "threadpoolctl>=3.6",
    "pyopencl==2026.1.4",
    "soundcard>=0.4.3",
    "sounddevice>=0.5",
    "aioesphomeapi==45.3.1",
    "sentencepiece==0.2.2",
    "tokenizers>=0.22",
    "inflect>=7.5",
    "nltk>=3.9.2",
    "cn2an>=0.5.23",
    "jieba>=0.42.1",
    "pypinyin>=0.55",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pyright>=1.1.400",
    "ruff>=0.12",
    "kaldi-native-fbank>=1.22",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pyright]
include = ["hoast", "tools", "tests", "finetune"]
# CUDA-only training is checked with finetune/env/pyrightconfig.json.
exclude = ["finetune/env", "finetune/train.py"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = ["UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

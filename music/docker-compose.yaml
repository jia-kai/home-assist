services:
  music-assistant-server:
    build: .
    image: home-assist/music-assistant-aec:latest
    container_name: music-assistant-server
    restart: unless-stopped
    # Network mode must be set to host for MA to discover and stream to players (see networking note below)
    network_mode: host
    env_file:
      - ../music.env
    volumes:
      - ${USERDIR:-$HOME}/music-data:/data/
    environment:
      # Provide logging level as environment variable.
      # default=info, possible=(critical, error, warning, info, debug)
      - LOG_LEVEL=info
      # The AEC bridge binds per-player sockets in this shared UID 1000 directory.
      - MA_AEC_REFERENCE_DIRECTORY=/data/aec-reference
    mem_limit: 1g

# Official 48 kHz XMOS-master test5; its version equals bundled 1.0.7.
substitutions:
  led_ring_cmd: "18"
  wake_route_category: "6"
  wake_route_source: "3"

packages:
  core: !include minimal.yaml

respeaker_xvf3800:
  firmware:
    url: https://raw.githubusercontent.com/respeaker/reSpeaker_XVF3800_USB_4MIC_ARRAY/f3908280ef4ab59048ace970eaf12ead7e640b2e/xmos_firmwares/i2s/respeaker_xvf3800_i2s_master_dfu_firmware_v1.0.7_48k_test5.bin
    version: "1.0.7"
    md5: 251881380da56b5ce27ccac6aeac7939

# The DFU version matches the bundled image, so boot's version check skips it.
api:
  actions:
    - action: flash_xmos_test5
      then:
        - respeaker_xvf3800.flash:
            id: respeaker

logger:
  level: DEBUG
  initial_level: INFO
  logs:
    respeaker_xvf3800: DEBUG
